<svg xmlns="http://www.w3.org/2000/svg" width="66" height="18" viewBox="0 0 66 18">
  <g stroke="#101317" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 枪托(厚实,内衬孔) -->
    <path d="M2 5 L12 4 L13.5 12 L6 14 Q2 11.5 2 5 Z" fill="#2a2e33"/>
    <!-- 机匣主体 -->
    <path d="M12 4 L40 3.4 L40 11.2 L13.5 12 Z" fill="#343a41"/>
    <!-- 提把+集成瞄具(参考图特征:大提把,橙色镜窗) -->
    <path d="M15 1 L34 0.6 Q36 0.6 36 2.2 L36 3.6 L15 4 Z" fill="#454b52"/>
    <path d="M18 1.4 L24 1.2 L24 3.8 L18 4 Z" fill="#16191d"/>
    <!-- 长护木(下压细分) -->
    <path d="M40 3.6 L57 4.2 Q58.6 4.8 58.6 7 Q58.6 9.4 57 9.8 L40 10.6 Z" fill="#2a2e33"/>
    <!-- 枪管+大消焰器 -->
    <path d="M58.6 5.4 L61 5.6 L61 8 L58.6 8.4 Z" fill="#16191d"/>
    <path d="M61 4.8 L65 5 L65 8.6 L61 8.8 Z" fill="#343a41"/>
    <!-- 前倾弹匣 -->
    <path d="M28 11.4 L35.5 11 Q36.4 15 33.5 17.2 L29.3 16.8 Q27.2 14 28 11.4 Z" fill="#2a2e33"/>
    <!-- 握把 -->
    <path d="M20 11.8 L24.5 11.6 L23.4 16.6 L20 16.4 Z" fill="#16191d"/>
    <!-- 前握把 -->
    <path d="M43 10.2 L46.5 10.1 L45.8 14 L43.3 13.8 Z" fill="#16191d"/>
  </g>
  <!-- 瞄具橙色镜窗 -->
  <rect x="19" y="1.7" width="4" height="1.9" rx="0.5" fill="#ff9d2e"/>
  <rect x="19.5" y="2" width="1.6" height="0.9" rx="0.4" fill="#ffd9a1"/>
  <!-- 机匣亮面/抛壳口/橙点 -->
  <path d="M13 4.6 L39 4 L39 5.8 L13.4 6.4 Z" fill="#4a5057"/>
  <rect x="32" y="7" width="5" height="2.2" rx="0.5" fill="#101317"/>
  <circle cx="15.8" cy="8.4" r="1" fill="#ff9d2e"/>
  <circle cx="26" cy="5.2" r="0.8" fill="#ff9d2e"/>
  <!-- 护木散热孔 -->
  <g fill="#101317">
    <rect x="42" y="6" width="4.4" height="1.8" rx="0.6"/>
    <rect x="48" y="6.1" width="4.4" height="1.8" rx="0.6"/>
    <rect x="54" y="6.2" width="3.4" height="1.7" rx="0.6"/>
  </g>
  <!-- 消焰器开槽 -->
  <path d="M62 5.2 L62 8.5 M63.5 5.1 L63.5 8.5" stroke="#101317" stroke-width="1.1"/>
  <!-- 枪托镂空 -->
  <path d="M4.5 6.2 L9.8 5.4 M5 9.4 L10.6 8.4" stroke="#454b52" stroke-width="1.4" fill="none"/>
</svg>
