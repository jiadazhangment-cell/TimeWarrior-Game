    <!-- 长护木 -->
    <path d="M38 3.8 L58 4.4 Q59.5 5 59.5 7.2 Q59.5 9.6 58 10 L38 10.8 Z" fill="#26292d"/>
    <!-- 枪管+消焰器 -->
    <path d="M59.5 5.6 L62.5 5.8 L62.5 8.2 L59.5 8.4 Z" fill="#1c1f23"/>
    <path d="M62.5 5.4 L65 5.6 L65 8.4 L62.5 8.6 Z" fill="#303439"/>
    <!-- 前倾弹匣 -->
    <path d="M27 11.2 L34.5 10.8 Q35.3 14.8 32.5 17 L28.3 16.6 Q26.3 13.8 27 11.2 Z" fill="#303439"/>
    <!-- 握把 -->
    <path d="M19.5 11.6 L24 11.4 L23 16.4 L19.6 16.3 Z" fill="#1c1f23"/>
  </g>
  <!-- 导轨齿 -->
  <path d="M16.5 1.4 L16.5 3.9 M19.5 1.4 L19.5 3.9 M22.5 1.3 L22.5 3.8 M25.5 1.3 L25.5 3.8 M28.5 1.3 L28.5 3.7 M31.5 1.3 L31.5 3.7 M34.5 1.2 L34.5 3.7" stroke="#16181b" stroke-width="1.1"/>
  <!-- 护木下导轨齿+镂空 -->
  <path d="M40 10.6 L56 10.2" stroke="#16181b" stroke-width="1.4"/>
  <g fill="#141619">
    <rect x="41" y="6" width="4.5" height="1.8" rx="0.5"/>
    <rect x="47.5" y="6" width="4.5" height="1.8" rx="0.5"/>
    <rect x="53.5" y="6.1" width="3.5" height="1.7" rx="0.5"/>
  </g>
  <!-- 机匣亮面+抛壳口 -->
  <path d="M14.5 4.6 L37 4.2 L37 5.8 L14.8 6.2 Z" fill="#4a5057"/>
  <rect x="30.5" y="6.8" width="4.6" height="2" rx="0.5" fill="#141619"/>
  <!-- 枪托镂空线 -->
  <path d="M4.5 6.5 L10 5.6 M5 9.5 L11 8.4" stroke="#454a50" stroke-width="1.4" fill="none"/>
</svg>
