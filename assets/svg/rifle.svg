<svg xmlns="http://www.w3.org/2000/svg" width="66" height="18" viewBox="0 0 66 18">
  <g stroke="#16181b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 枪托(棱角,带镂空线) -->
    <path d="M2 5.5 L13 4 L14.5 11.5 L6.5 14 Q2 11.5 2 5.5 Z" fill="#26292d"/>
    <!-- 机匣 -->
    <path d="M13 4 L38 3.5 L38 11 L14.5 11.8 Z" fill="#303439"/>
