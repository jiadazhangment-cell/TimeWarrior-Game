<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>流体爆炸实验台 · fluid-lab</title>
<style>
  html,body{margin:0;background:#07090d;color:#cfd8e3;font:13px/1.5 sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgba(7,9,13,.85);z-index:2}
  button{background:#1a212c;color:#cfd8e3;border:1px solid #2a323e;border-radius:4px;padding:5px 12px;cursor:pointer}
  button:hover{border-color:#ffd27a;color:#ffd27a}
  #fps{margin-left:auto;color:#7fff9e;font-family:monospace}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #tip{position:fixed;bottom:10px;left:12px;color:#93a1b3;z-index:2}
</style>
</head>
<body>
<div id="bar">
  <b>流体爆炸实验台 <span style="color:#ffd27a">v8·按调研基准校准</span></b>
  <button data-scene="air">空中爆</button>
  <button data-scene="ground">平地爆</button>
  <button data-scene="wall">平地爆·旁边有墙</button>
  <button data-scene="chain">连锁双爆</button>
  <span id="fps"></span>
</div>
<div id="tip">点击画面任意处 = 在该处引爆(障碍物内无效)。真实模拟:底边不规则、火焰绕障碍、连续演化无帧。</div>
<canvas id="cv"></canvas>
<script>
'use strict'
// ============ 2D 欧拉网格流体(stable fluids)+ 燃料/温度/烟 三场燃烧模型 ============
// 每帧:平流(速度/物质)→ 燃烧转化 → 浮力 → 涡度增强 → 散度 → 压力 Jacobi → 投影 → 渲染
// 障碍物=边界条件:速度清零、压力诺伊曼边界(固体邻居取中心值)、平流不穿透。
const SIM_W = 288, SIM_H = 162            // 模拟网格(16:9)
const PRESSURE_ITERS = 26
const cv = document.getElementById('cv')
const gl = cv.getContext('webgl2', { antialias: false, alpha: false })
if (!gl) { document.body.innerHTML = '需要 WebGL2'; throw 0 }
if (!gl.getExtension('EXT_color_buffer_float')) { document.body.innerHTML = '需要 EXT_color_buffer_float'; throw 0 }
const canLinear = !!gl.getExtension('OES_texture_float_linear')

function resize() { cv.width = innerWidth; cv.height = innerHeight }
resize(); addEventListener('resize', resize)

// ---------- GL 工具 ----------
const VS = `#version 300 es
layout(location=0) in vec2 p; out vec2 uv;
void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0,1); }`
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s)
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src)
  return s
}
function program(fs) {
  const p = gl.createProgram()
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS))
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs))
  gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p))
  const uni = {}
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS)
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); uni[info.name] = gl.getUniformLocation(p, info.name) }
  return { p, uni }
}
const quad = gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER, quad)
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW)
gl.enableVertexAttribArray(0)
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)

function makeTex(w, h, internal, format, type, filter) {
  const t = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, t)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null)
  return t
}
function makeTarget(w, h, internal) {
  const filter = canLinear ? gl.LINEAR : gl.NEAREST
  const tex = makeTex(w, h, internal, internal === gl.R16F ? gl.RED : (internal === gl.RG16F ? gl.RG : gl.RGBA), gl.HALF_FLOAT, filter)
  const fb = gl.createFramebuffer()
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb)
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0)
  return { tex, fb, w, h }
}
function makePing(w, h, internal) {
  return { a: makeTarget(w, h, internal), b: makeTarget(w, h, internal),
    swap() { const t = this.a; this.a = this.b; this.b = t } }
}
const vel = makePing(SIM_W, SIM_H, gl.RG16F)     // 速度 uv/s
const mat = makePing(SIM_W, SIM_H, gl.RGBA16F)   // r=燃料 g=温度 b=烟
const prs = makePing(SIM_W, SIM_H, gl.R16F)
const div = makeTarget(SIM_W, SIM_H, gl.R16F)
const crl = makeTarget(SIM_W, SIM_H, gl.R16F)

// 障碍物纹理(R8,canvas2d 光栅化;固体=1)
const obCv = document.createElement('canvas'); obCv.width = SIM_W; obCv.height = SIM_H
const obCtx = obCv.getContext('2d')
const obTex = makeTex(SIM_W, SIM_H, gl.R8, gl.RED, gl.UNSIGNED_BYTE, gl.NEAREST)
let obstacles = []   // {x,y,w,h} uv 空间(y 向下)
function uploadObstacles() {
  obCtx.clearRect(0, 0, SIM_W, SIM_H)
  obCtx.fillStyle = '#fff'
  for (const o of obstacles) obCtx.fillRect(o.x * SIM_W, o.y * SIM_H, o.w * SIM_W, o.h * SIM_H)
  const img = obCtx.getImageData(0, 0, SIM_W, SIM_H)
  const r = new Uint8Array(SIM_W * SIM_H)
  for (let i = 0; i < r.length; i++) r[i] = img.data[i * 4]
  gl.bindTexture(gl.TEXTURE_2D, obTex)
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, SIM_W, SIM_H, 0, gl.RED, gl.UNSIGNED_BYTE, r)
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false)
}

// ---------- Shaders ----------
const HEAD = `#version 300 es
precision highp float; in vec2 uv; out vec4 O;
uniform vec2 texel; uniform sampler2D obs;
float solid(vec2 p){ return texture(obs, p).r; }`

const pAdvectVel = program(HEAD + `
uniform sampler2D velT; uniform float dt; uniform float diss;
void main(){
  if (solid(uv) > 0.5) { O = vec4(0); return; }
  vec2 back = uv - dt * texture(velT, uv).xy;
  vec2 v = texture(velT, back).xy * diss;
  O = vec4(v, 0, 1);
}`)
const pAdvectMat = program(HEAD + `
uniform sampler2D velT; uniform sampler2D matT; uniform float dt;
uniform float kFuel; uniform float cooling;
// 燃烧模型 = SIGGRAPH'02 Nguyen/Fedkiw/Jensen 双场模型的实时版(fire-simulation 实证配方):
// 燃料单指数衰减(k_fuel 主控存活时长:1s→4.6);温度不做平流衰减,冷却全靠 Stefan-Boltzmann
// 四次方项;**只要还有燃料,温度每帧被 max() 顶回 fuel*burnT=燃料"续命"**——所以调"火活多久"
// 调 kFuel,调"余烬熄灭脆不脆"才调 cooling,别搞混(读源码才发现的耦合,docs/流体爆炸调研)
void main(){
  if (solid(uv) > 0.5) { O = vec4(0); return; }
  vec2 back = uv - dt * texture(velT, uv).xy;
  if (solid(back) > 0.5) back = uv;              // 不从固体内取样
  vec4 m = texture(matT, back);
  float fuel = m.r, temp = m.g, smoke = m.b;
  // **爆炸是预混燃烧,不是扩散火焰**:燃料在冲击波扫过时瞬间全部点燃,火球核心最亮——
  // 用 fuel*(1-fuel) 那套"缺氧暗腔"是篝火/喷嘴的模型,套在爆炸上会烧出生硬黑洞(试过,是错的)。
  // 火球表面的暗纹来自**烟遮住火光**(渲染层做),不是这里不烧
  float fuel2 = fuel * exp(-kFuel * dt);
  smoke += (fuel - fuel2) * 1.1;
  temp = max(temp - dt * cooling * pow(max(temp, 0.0), 4.0), fuel2);
  smoke *= exp(-2.1 * dt);   // 烟也要短(游戏基准:衰变段占比 ≤ 膨胀+峰值,绝不拖沓)
  O = vec4(fuel2, temp, smoke, 1);
}`)
const pForces = program(HEAD + `
uniform sampler2D velT; uniform sampler2D matT; uniform sampler2D crlT; uniform float dt; uniform float vort; uniform float time;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + time) * 43758.5453); }
void main(){
  if (solid(uv) > 0.5) { O = vec4(0); return; }
  vec2 v = texture(velT, uv).xy;
  vec4 m = texture(matT, uv);
  // 浮力完整式(GPU Gems 38):热升 - 烟重(重烟下沉与热气分层);爆炸浮力比篝火低(调研建议 0.05-0.15 档)
  v.y += dt * (m.g * 0.6 - m.b * 0.05 + m.b * 0.14);
  // 涡度增强(火焰专用 15 档,>20 会把爆炸形状搅碎)+ 噪声混入 curl = 廉价次网格湍流
  float L = texture(crlT, uv - vec2(texel.x, 0)).r, R = texture(crlT, uv + vec2(texel.x, 0)).r;
  float B = texture(crlT, uv - vec2(0, texel.y)).r, T = texture(crlT, uv + vec2(0, texel.y)).r;
  float c = texture(crlT, uv).r;
  c *= 0.8 + 0.5 * hash(uv * 37.0);
  vec2 grad = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  grad = grad / (length(grad) + 1e-5);
  v += dt * vort * vec2(grad.x, -grad.y) * c;
  O = vec4(v, 0, 1);
}`)
const pCurl = program(HEAD + `
uniform sampler2D velT;
void main(){
  float L = texture(velT, uv - vec2(texel.x, 0)).y, R = texture(velT, uv + vec2(texel.x, 0)).y;
  float B = texture(velT, uv - vec2(0, texel.y)).x, T = texture(velT, uv + vec2(0, texel.y)).x;
  O = vec4(0.5 * ((R - L) - (T - B)), 0, 0, 1);
}`)
const pDiv = program(HEAD + `
uniform sampler2D velT;
vec2 vAt(vec2 p, vec2 fallback){ return solid(p) > 0.5 ? vec2(0) : texture(velT, p).xy; }
void main(){
  vec2 L = vAt(uv - vec2(texel.x, 0), uv), R = vAt(uv + vec2(texel.x, 0), uv);
  vec2 B = vAt(uv - vec2(0, texel.y), uv), T = vAt(uv + vec2(0, texel.y), uv);
  O = vec4(0.5 * (R.x - L.x + T.y - B.y), 0, 0, 1);
}`)
const pJacobi = program(HEAD + `
uniform sampler2D prsT; uniform sampler2D divT;
float pAt(vec2 p, float c){ return solid(p) > 0.5 ? c : texture(prsT, p).r; }
void main(){
  float c = texture(prsT, uv).r;
  float L = pAt(uv - vec2(texel.x, 0), c), R = pAt(uv + vec2(texel.x, 0), c);
  float B = pAt(uv - vec2(0, texel.y), c), T = pAt(uv + vec2(0, texel.y), c);
  O = vec4((L + R + B + T - texture(divT, uv).r) * 0.25, 0, 0, 1);
}`)
const pProject = program(HEAD + `
uniform sampler2D velT; uniform sampler2D prsT;
float pAt(vec2 p, float c){ return solid(p) > 0.5 ? c : texture(prsT, p).r; }
void main(){
  if (solid(uv) > 0.5) { O = vec4(0); return; }
  float c = texture(prsT, uv).r;
  float L = pAt(uv - vec2(texel.x, 0), c), R = pAt(uv + vec2(texel.x, 0), c);
  float B = pAt(uv - vec2(0, texel.y), c), T = pAt(uv + vec2(0, texel.y), c);
  vec2 v = texture(velT, uv).xy - 0.5 * vec2(R - L, T - B);
  O = vec4(v, 0, 1);
}`)
const pSplat = program(HEAD + `
uniform sampler2D srcT; uniform vec2 pt; uniform vec3 amount; uniform float radius; uniform vec2 velAdd; uniform float aspect; uniform float seed;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + seed) * 43758.5453); }
void main(){
  vec4 c = texture(srcT, uv);
  vec2 d = uv - pt; d.x *= aspect;
  // 注入同帧带噪声:高斯核数学上是正圆,不加噪声要等涡度搅几帧才不规则——
  // 而爆炸第一帧就该不规则(调研配方:fire-sim 里被注释掉的 noiseBlending 开关,爆炸场景开满)
  float n = 0.55 + 0.9 * hash(uv * 53.0);
  float g = exp(-dot(d, d) / (radius * radius)) * n;
  if (solid(uv) > 0.5) { O = c; return; }
  if (length(velAdd) > 0.0) {
    vec2 dir = length(d) > 1e-5 ? normalize(d) : vec2(0, 1);
    O = vec4(c.xy + dir * velAdd.x * g, 0, 1);
  } else {
    // fuel 用 max 饱和注入(不叠加爆表);temp 尖峰同样 max(闪光会被 T^4 冷却自动烧回);烟叠加
    O = vec4(max(c.r, amount.x * g), max(c.g, amount.y * g), c.b + amount.z * g, 1);
  }
}`)
const pShow = program(HEAD + `
uniform sampler2D matT; uniform float time;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
}
vec3 blackbody(float t){
  // 蓝通道阈值抬高=只有最核心才发白,其余是黄/橙/暗红(压低才不会整团过曝成一片白)
  vec3 c = vec3(0);
  c.r = smoothstep(0.0, 0.15, t) * 1.12;
  c.g = smoothstep(0.20, 0.66, t) * 0.98;
  c.b = smoothstep(0.62, 1.08, t) * 0.92;
  return c;
}
void main(){
  vec4 m = texture(matT, uv);
  float t = m.g;
  // **火焰不是半透明染料,是自发光体**:黑体辐射在可见光段随温度陡降,所以火有清晰的火舌边界、
  // 熄灭是斑驳地局部灭 —— 而不是整团均匀褪色(用户点名"火做得像烟雾一样颜色慢慢变浅")。
  // 做法:①噪声调制温度场(边缘撕裂+熄灭斑驳)②阈值化可见度(到温度才亮,不到直接黑)③亮度 ∝ t²
  float n = vnoise(uv * vec2(46.0, 26.0) + vec2(0.0, -time * 0.35)) * 0.55
          + vnoise(uv * vec2(115.0, 65.0) + vec2(time * 0.2, -time * 0.7)) * 0.3;
  float tt = t * (0.72 + 0.62 * n);
  // **火的消失=可见火域收缩**(阈值 0.40-0.56:降温时火从外缘向内快速缩没,消失快而脆——
  // 物理依据=德雷伯点 525°C,低于它人眼看不到发光,调研档 docs/流体爆炸调研/)。
  float vis = smoothstep(0.40, 0.56, tt);
  // **颜色=硬色带跳变,不是连续渐变**(Metal Slug 逐像素实测的公认基准:单帧 3-5 个平涂色阶,
  // 帧间色带整体跳变;连续插值渐变正是"像烟雾一样慢慢变色"观感的来源)——温度量化成 5 档再取色
  float ttq = floor(tt * 5.0 + 0.5) / 5.0;
  vec3 fire = blackbody(ttq) * (0.9 + 0.5 * ttq) * vis;
  // 烟:燃料类爆炸=深灰近黑(不完全燃烧的烟灰),量少、衰减期才明显——不再是那团土黄
  float smoke = clamp(m.b * 0.34 * (0.75 + 0.5 * n), 0.0, 0.8);
  fire *= exp(-smoke * 0.4);
  vec3 smokeCol = vec3(0.215, 0.21, 0.205) * smoke;
  vec3 col = smokeCol * (1.0 - vis * 0.85) + fire;
  if (solid(uv) > 0.5) col = vec3(0.13, 0.15, 0.18);
  O = vec4(col, 1);
}`)

// ---------- 帧循环 ----------
function bindTex(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex) }
function run(prog, target, setup) {
  gl.useProgram(prog.p)
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null)
  gl.viewport(0, 0, target ? target.w : cv.width, target ? target.h : cv.height)
  gl.uniform2f(prog.uni.texel, 1 / SIM_W, 1 / SIM_H)
  bindTex(7, obTex); gl.uniform1i(prog.uni.obs, 7)
  setup(prog.uni)
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
}
function splat(pt, amount, radius, velKick) {
  const seed = Math.random() * 100
  run(pSplat, mat.b, (u) => {
    bindTex(0, mat.a.tex); gl.uniform1i(u.srcT, 0)
    gl.uniform2f(u.pt, pt.x, pt.y); gl.uniform3f(u.amount, amount[0], amount[1], amount[2])
    gl.uniform1f(u.radius, radius); gl.uniform2f(u.velAdd, 0, 0); gl.uniform1f(u.aspect, SIM_W / SIM_H)
    gl.uniform1f(u.seed, seed)
  }); mat.swap()
  if (velKick) {
    run(pSplat, vel.b, (u) => {
      bindTex(0, vel.a.tex); gl.uniform1i(u.srcT, 0)
      gl.uniform2f(u.pt, pt.x, pt.y); gl.uniform3f(u.amount, 0, 0, 0)
      gl.uniform1f(u.radius, radius * 1.5); gl.uniform2f(u.velAdd, velKick, 0); gl.uniform1f(u.aspect, SIM_W / SIM_H)
      gl.uniform1f(u.seed, seed + 7)
    }); vel.swap()
  }
}
// 爆炸注入(调研配方):fuel 饱和注入(温度由燃烧派生,不单独注)+ 爆心闪光温度尖峰
// (1.8×burnT,只盖核心区,T^4 冷却会让它自己几帧内烧回正常火焰温度=第一帧极亮白光)
// + 径向速度冲量 + 注入自带噪声(shader 内)。补一拍撑火体。
// **爆炸不是"注入一小团再靠速度推开"**(用户点名"像滴入水中的颜料慢慢向外扩散")——
// 那是染料扩散的过程。真实爆炸的火球半径由冲击波在几毫秒内一次定死,之后火球基本停在原地烧。
// 定版:①燃料球**直接注入接近最终半径**(0.135),不靠平流长大 ②速度冲量只留一点点(1.1)用于
// 撕碎形状,不承担"推开"职责 ③速度场急停(耗散 9/s,~120ms 内流场基本静止)=火球停住原地翻滚。
function boom(x, y, power = 1) {
  const R = 0.135 * Math.sqrt(power)
  splat({ x, y }, [1.0, 0, 0.06 * power], R, 1.1 * power)          // 燃料直接铺到最终尺寸
  // 起爆白闪=**全域**过曝(公认基准:爆炸开场是 1-3 帧纯白实心闪,任何"火"的颜色之前);
  // 温度 2.6 靠 T^4 冷却在 ~80ms 内自己烧回正常火焰档=白闪自然让位,不用手动淡出
  splat({ x, y }, [0, 2.6, 0], R * 0.95, 0)
  // 沿球面撒 5 处随机小燃料簇:椰菜花式多凸起轮廓(公认基准:火球从不是纯圆)
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI * 2, d = R * (0.55 + Math.random() * 0.5)
    splat({ x: x + Math.cos(a) * d * 0.62, y: y + Math.sin(a) * d }, [0.85, 0, 0], R * 0.42, 0)
  }
}

let last = performance.now(), acc = 0, frames = 0, fpsAt = last
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now
  // 平流速度。**速度耗散=爆炸节奏的灵魂**:真实爆炸是"前段猛、后段急刹车"——初速全靠注入冲量,
  // 之后 rate 2.8/s 的指数刹车让膨胀在 ~300ms 内基本停住(旧值≈0.036/s 等于没刹,火团一直慢慢飘=用户点名"太慢")
  run(pAdvectVel, vel.b, (u) => { bindTex(0, vel.a.tex); gl.uniform1i(u.velT, 0); gl.uniform1f(u.dt, dt); gl.uniform1f(u.diss, Math.exp(-9.0 * dt)) }); vel.swap()
  // 平流物质+燃烧(kFuel=4.0 → 火存活约 1.1s;cooling 只管余烬尾巴脆度)
  run(pAdvectMat, mat.b, (u) => {
    bindTex(0, vel.a.tex); gl.uniform1i(u.velT, 0)
    bindTex(1, mat.a.tex); gl.uniform1i(u.matT, 1)
    gl.uniform1f(u.dt, dt)
    // kFuel 2.3+阈值 0.40 → 火可见期 ~0.35s(快);cooling 4.5=燃料尽后余温立即掉光,无暗红拖尾
    gl.uniform1f(u.kFuel, 2.3); gl.uniform1f(u.cooling, 4.5)
  }); mat.swap()
  // 涡度
  run(pCurl, crl, (u) => { bindTex(0, vel.a.tex); gl.uniform1i(u.velT, 0) })
  // 浮力+涡度力
  run(pForces, vel.b, (u) => {
    bindTex(0, vel.a.tex); gl.uniform1i(u.velT, 0)
    bindTex(1, mat.a.tex); gl.uniform1i(u.matT, 1)
    bindTex(2, crl.tex); gl.uniform1i(u.crlT, 2)
    gl.uniform1f(u.dt, dt); gl.uniform1f(u.vort, 15.0); gl.uniform1f(u.time, now * 0.001)
  }); vel.swap()
  // 投影
  run(pDiv, div, (u) => { bindTex(0, vel.a.tex); gl.uniform1i(u.velT, 0) })
  gl.bindFramebuffer(gl.FRAMEBUFFER, prs.a.fb); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT)
  for (let i = 0; i < PRESSURE_ITERS; i++) {
    run(pJacobi, prs.b, (u) => {
      bindTex(0, prs.a.tex); gl.uniform1i(u.prsT, 0)
      bindTex(1, div.tex); gl.uniform1i(u.divT, 1)
    }); prs.swap()
  }
  run(pProject, vel.b, (u) => {
    bindTex(0, vel.a.tex); gl.uniform1i(u.velT, 0)
    bindTex(1, prs.a.tex); gl.uniform1i(u.prsT, 1)
  }); vel.swap()
  // 显示
  run(pShow, null, (u) => { bindTex(0, mat.a.tex); gl.uniform1i(u.matT, 0); gl.uniform1f(u.time, now * 0.001) })

  frames++
  if (now - fpsAt > 500) {
    document.getElementById('fps').textContent = Math.round(frames * 1000 / (now - fpsAt)) + ' fps · ' + SIM_W + '×' + SIM_H + ' · Jacobi×' + PRESSURE_ITERS
    frames = 0; fpsAt = now
  }
  requestAnimationFrame(frame)
}

// ---------- 场景 ----------
function clearFields() {
  for (const t of [vel.a, vel.b, mat.a, mat.b, prs.a, prs.b]) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT)
  }
}
const GROUND = { x: 0, y: 0, w: 1, h: 0.09 }   // uv 底部固体条(y 向上,0=底)
// 注意:obstacle canvas 的 y 向下,上传时 FLIP_Y,所以这里统一用"y 向上"的 uv 定义,画时翻转
function setScene(name) {
  clearFields()
  if (name === 'air') {
    obstacles = []
    uploadObstacles()
    boom(0.5, 0.55, 1)
  } else if (name === 'ground') {
    obstacles = [flip(GROUND)]
    uploadObstacles()
    boom(0.5, 0.115, 1)
  } else if (name === 'wall') {
    obstacles = [flip(GROUND), flip({ x: 0.63, y: 0.09, w: 0.022, h: 0.24 })]
    uploadObstacles()
    boom(0.565, 0.115, 1)
  } else if (name === 'chain') {
    obstacles = [flip(GROUND)]
    uploadObstacles()
    boom(0.42, 0.115, 1)
    setTimeout(() => boom(0.6, 0.115, 0.9), 260)
  }
}
function flip(o) { return { x: o.x, y: 1 - o.y - o.h, w: o.w, h: o.h } } // y向上 → canvas y向下
for (const b of document.querySelectorAll('#bar button')) b.onclick = () => setScene(b.dataset.scene)
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect()
  boom((e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height, 1)
})
setScene('wall')
requestAnimationFrame(frame)
</script>
</body>
</html>
